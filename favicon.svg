<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ikon pohon hierarki">
  <!-- Latar belakang lembut -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#F8F9FC"/>

  <!-- Garis penghubung antar simpul (edges) -->
  <g stroke="#2E6BD6" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="32" y1="22" x2="16" y2="42"/>
    <line x1="32" y1="22" x2="48" y2="42"/>
  </g>

  <!-- Simpul akar (root) -->
  <circle cx="32" cy="18" r="9" fill="#1F3B73"/>

  <!-- Simpul anak (child) kiri -->
  <circle cx="16" cy="46" r="8" fill="#2E6BD6"/>

  <!-- Simpul anak (child) kanan -->
  <circle cx="48" cy="46" r="8" fill="#2E6BD6"/>
</svg>